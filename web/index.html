<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Zoom utilisateur conservé (accessibilité) : le délai de tap Safari
       est déjà éliminé par touch-action: manipulation + width=device-width,
       et le décalage post-clavier par l'épinglage de scroll plus bas. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mes Km — suivi local des kilomètres professionnels.">

  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mes Km">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Couleur de l'interface système, cohérente avec le thème V2 -->
  <meta name="theme-color" content="#FBFCFE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mes Km</title>
  <link rel="manifest" href="manifest.json">

  <!-- Fond immédiat pendant le chargement du moteur Flutter :
       évite l'écran blanc prolongé, suit le mode clair/sombre système. -->
  <style>
    /* Shell volontairement proche du standard Flutter Web.
       - overflow:hidden + overscroll-behavior : la page hôte ne défile pas ;
       - touch-action: manipulation : pas de délai de double-tap Safari ;
       - PAS de body{position:fixed} : sur Safari iOS en PWA standalone,
         un body fixe décale le hit-testing initial (bas d'écran mort
         jusqu'au premier cycle focus/clavier qui force un recalcul des
         métriques) — cause du bug « premier toucher » KM-006D.
       Le maintien de la page à l'origine après le clavier (bug KM-004C)
       est assuré par l'épinglage de scroll ci-dessous, pas par du fixed. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      background-color: #FBFCFE;
    }
    #splash {
      position: fixed;
      z-index: 1000;
      inset: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      background-color: #FBFCFE;
      color: #1D5BD8;
      font-family: -apple-system, system-ui, sans-serif;
    }
    .splash-watermark {
      position: absolute;
      width: min(155vw, 850px);
      opacity: .075;
      transform: rotate(-12deg);
      pointer-events: none;
    }
    .splash-mark {
      position: relative;
      display: grid;
      justify-items: center;
      gap: 14px;
      text-align: center;
      padding: 24px;
    }
    .splash-mark img { border-radius: 24px; }
    .splash-mark strong { font-size: 28px; letter-spacing: -.7px; }
    .splash-mark small { color: #556273; font-size: 13px; }
    .splash-domain {
      position: absolute;
      top: 50%; left: 50%;
      font-size: 18px; font-weight: 600; letter-spacing: .3px;
      opacity: 0;
      animation: splash-domain 2.1s ease-in-out infinite;
    }
    @keyframes splash-domain {
      0%, 28% { transform: translate(calc(-50% - 65px), -155px); opacity: 0; }
      12%, 20% { transform: translate(calc(-50% - 65px), -155px); opacity: .85; }
      33%, 61% { transform: translate(calc(-50% + 60px), 130px); opacity: 0; }
      43%, 53% { transform: translate(calc(-50% + 60px), 130px); opacity: .85; }
      66%, 100% { transform: translate(calc(-50% - 35px), 165px); opacity: 0; }
      77%, 88% { transform: translate(calc(-50% - 35px), 165px); opacity: .85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-domain { animation: none; opacity: 1; transform: translate(-50%, 135px); }
      .splash-watermark { transform: none; }
    }
    @media (prefers-color-scheme: dark) {
      html, body, #splash { background-color: #111318; }
      #splash { color: #95B9FF; }
      .splash-mark small { color: #B7C2D2; }
      .splash-watermark { opacity: .045; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Chargement de Mes Km">
    <img class="splash-watermark" src="icons/Icon-512.png" alt="" aria-hidden="true">
    <div class="splash-mark">
      <img src="icons/Icon-192.png" width="104" height="104" alt="">
      <strong>Mes Km</strong>
      <small>Vos kilomètres professionnels, simplement.</small>
    </div>
    <span class="splash-domain" aria-hidden="true">MesKm.fr</span>
  </div>
  <script>
    // Un seul splash HTML : Flutter démarre immédiatement derrière.
    // Au-delà du minimum, la première frame retire le splash sans délai ajouté.
    var splashStarted = performance.now();
    var splashMinimum = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 2100;
    window.addEventListener('flutter-first-frame', function () {
      var remaining = Math.max(0, splashMinimum - (performance.now() - splashStarted));
      var dismiss = function () {
        var splash = document.getElementById('splash');
        if (splash) splash.remove();
      };
      if (remaining === 0) dismiss(); else window.setTimeout(dismiss, remaining);
    }, { once: true });

    // Épinglage de scroll : quand le clavier iOS s'ouvre, Safari peut faire
    // défiler la page hôte (scroll-into-view) et le décalage peut persister
    // après fermeture — le hit-testing Flutter serait alors désaligné
    // (bug KM-004C). On ramène la page à l'origine à chaque défilement ou
    // changement de viewport visuel. Correctif d'état standard : aucune
    // interaction simulée, aucun délai.
    (function () {
      var pin = function () {
        if (window.scrollX !== 0 || window.scrollY !== 0) {
          window.scrollTo(0, 0);
        }
      };
      window.addEventListener('scroll', pin);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', pin);
      }
    })();

    // Service worker Mes Km (UX-008C) : précache du shell => lancement
    // HORS LIGNE de la PWA installée. (Flutter 3.35+ ne fournit plus de
    // SW de cache ; voir tool/sw_template.js.) Enregistré après le
    // chargement pour ne jamais retarder le premier rendu.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
  <!-- Bootstrap : démarrage immédiat du moteur, SANS serviceWorkerSettings.
       Diagnostic UX-008C : depuis Flutter 3.35+, flutter_service_worker.js
       n'est qu'un DÉSINSTALLEUR — l'enregistrer via le loader n'apportait
       aucun cache et entrait en conflit avec notre sw.js de précache
       (enregistré plus haut). L'ancienne attente plafonnée à 800 ms
       (KM-006C) n'a plus d'objet : plus d'attente du tout. -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load();
  </script>
</body>
</html>
