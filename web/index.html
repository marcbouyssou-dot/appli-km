<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Zoom utilisateur conservé (accessibilité) : le délai de tap Safari
       est déjà éliminé par touch-action: manipulation + width=device-width,
       et le décalage post-clavier par le verrouillage du scroll (body fixe). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mes Km — suivi local des kilomètres professionnels.">

  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mes Km">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Couleur de l'interface système, cohérente avec le thème V2 -->
  <meta name="theme-color" content="#F9F9FF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mes Km</title>
  <link rel="manifest" href="manifest.json">

  <!-- Fond immédiat pendant le chargement du moteur Flutter :
       évite l'écran blanc prolongé, suit le mode clair/sombre système. -->
  <style>
    /* Page verrouillée : sur Safari iOS, le focus d'un champ fait défiler
       la page (scroll-into-view) et le décalage peut persister après la
       fermeture du clavier — les taps atterrissent alors à côté des
       éléments (navigation basse « morte », imprécision). position:fixed +
       overflow:hidden empêchent tout défilement de la page hôte ;
       touch-action: manipulation élimine le délai de tap restant. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      background-color: #F9F9FF;
    }
    body {
      position: fixed;
      inset: 0;
      width: 100%;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #007AFF;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #121318; }
    }
  </style>
</head>
<body>
  <div id="splash">Mes Km</div>
  <script>
    // Retire le fond de chargement dès que Flutter a rendu sa première frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) { splash.remove(); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
