<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Zoom utilisateur conservé (accessibilité) : le délai de tap Safari
       est déjà éliminé par touch-action: manipulation + width=device-width,
       et le décalage post-clavier par l'épinglage de scroll plus bas. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mes Km — suivi local des kilomètres professionnels.">

  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mes Km">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Couleur de l'interface système, cohérente avec le thème V2 -->
  <meta name="theme-color" content="#FBFCFE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mes Km</title>
  <link rel="manifest" href="manifest.json">

  <!-- Fond immédiat pendant le chargement du moteur Flutter :
       évite l'écran blanc prolongé, suit le mode clair/sombre système. -->
  <style>
    /* Shell volontairement proche du standard Flutter Web.
       - overflow:hidden + overscroll-behavior : la page hôte ne défile pas ;
       - touch-action: manipulation : pas de délai de double-tap Safari ;
       - PAS de body{position:fixed} : sur Safari iOS en PWA standalone,
         un body fixe décale le hit-testing initial (bas d'écran mort
         jusqu'au premier cycle focus/clavier qui force un recalcul des
         métriques) — cause du bug « premier toucher » KM-006D.
       Le maintien de la page à l'origine après le clavier (bug KM-004C)
       est assuré par l'épinglage de scroll ci-dessous, pas par du fixed. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      background-color: #FBFCFE;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #1D5BD8; /* bleu Mes Km (UX-001C) */
      /* Pulsation : l'état de chargement VIVANT est reconnaissable,
         jamais une interface qui semble prête mais morte. */
      animation: splash-pulse 1.2s ease-in-out infinite;
    }
    @keyframes splash-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #111318; }
    }
  </style>
</head>
<body>
  <div id="splash">Mes Km</div>
  <script>
    // Retire le fond de chargement dès que Flutter a rendu sa première frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) { splash.remove(); }
    });

    // Épinglage de scroll : quand le clavier iOS s'ouvre, Safari peut faire
    // défiler la page hôte (scroll-into-view) et le décalage peut persister
    // après fermeture — le hit-testing Flutter serait alors désaligné
    // (bug KM-004C). On ramène la page à l'origine à chaque défilement ou
    // changement de viewport visuel. Correctif d'état standard : aucune
    // interaction simulée, aucun délai.
    (function () {
      var pin = function () {
        if (window.scrollX !== 0 || window.scrollY !== 0) {
          window.scrollTo(0, 0);
        }
      };
      window.addEventListener('scroll', pin);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', pin);
      }
    })();
  </script>
  <!-- Bootstrap personnalisé : le loader Flutter ATTEND par défaut
       l'activation/mise à jour du service worker (plafond 4000 ms) avant
       même de télécharger le moteur — principale latence au lancement de
       la PWA (surtout après une mise à jour de version). On plafonne cette
       attente à 800 ms : au-delà, l'app démarre immédiatement (réseau ou
       cache HTTP) et le service worker finit de s'activer en arrière-plan,
       sans perdre le fonctionnement hors ligne des lancements suivants. -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      serviceWorkerSettings: {
        serviceWorkerVersion: {{flutter_service_worker_version}},
        timeoutMillis: 800,
      },
    });
  </script>
</body>
</html>
