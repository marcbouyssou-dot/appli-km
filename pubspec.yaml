name: mes_km
description: "Mes Km — suivi local des kilomètres professionnels sur iPhone."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  sembast: ^3.8.7
  sembast_web: ^2.4.4+1
  uuid: ^4.6.0
  flutter_riverpod: ^3.3.2
  web: ^1.1.1
  http: ^1.6.0
  pdf: ^3.12.0
  # Transitif de pdf, épinglé : image 4.11.0 déclare archive ^4.0.9 mais
  # utilise une API d'archive >=4.4 (bug corrigé en 4.11.1, incompatible
  # avec pdf 3.12 qui exige archive <4.1). À retirer quand pdf >=3.13.1
  # sera installable (Dart >=3.12).
  image: '>=4.1.0 <4.11.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fiscal/
    - assets/brand/
  # Inter 4.1 (SIL OFL), sous-ensemble latin/latin-ext + € → (pyftsubset) :
  # ~66 Ko par graisse au lieu de ~420 Ko. Aucune police distante.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
