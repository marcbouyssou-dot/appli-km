worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/wasm application/json text/css image/svg+xml;

    server {
        listen 8080;
        root /srv/meskm;
        index index.html;
        # Flutter uses stable filenames, including main.dart.js and assets.
        # HTTP revalidation + the existing versioned service worker handle updates.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
        # Aperçu intégré Mes Km : seul ce document peut être encadré
        # par l'application de même origine. Les autres pages restent DENY.
        location = /pdf_preview/index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
        }
        location ~ /\. { return 404; }
        location ~* \.mjs$ {
            types { application/javascript mjs; }
            try_files $uri =404;
        }
        # A missing script/asset must return 404, never an HTML app shell.
        location ~* \.(?:js|mjs|wasm|json|bin|png|ico|svg|jpg|jpeg|webp|ttf|otf|woff2?|css|map)$ {
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
